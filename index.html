<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>je suis sur header</h1>
    </header>

    <nav>
        <a href="#acceuil">Accueil</a>
        <a href="#apropos">À propos</a>
        <a href="#competences">Compétences</a>
        <a href="#projets">Projets</a>
        <a href="#contact">Contact</a>
        <button id="darkModeBtn">Mode sombre</button>
    </nav>

    <main>
        <h1>je suis sur main</h1>
    </main>

    <button id="btnMessage">Clique ici</button>
    <p id="message"></p>


    <input type="text" id="nom" placeholder="Entre ton nom">
    <button id="btnNom">Valider</button>
    <p id="resultatNom"></p>
    
    <form id="contactForm">
        <input type="text" id="prenom" placeholder="Prénom">
        <input type="email" id="email" placeholder="Email">
        <textarea id="messageContact" placeholder="Message"></textarea>
        <button type="submit">Envoyer</button>
    </form>

    <p id="formResult"></p>
    
    <input type="text" id="competenceInput" placeholder="Ajouter une compétence">
    <button id="addCompetence">Ajouter</button>
    <ul id="competenceList"></ul>
    
    
    
    
    <section>
        <div id="acceuil">
            <h1>je suis sur section</h1>
        </div>
    </section>

    <footer>
        <h1>je suis sur footer</h1>
    </footer>


    <script src="script.js"></script>

</body>
</html>
